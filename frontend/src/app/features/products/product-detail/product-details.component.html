<div class="container py-4">

  @if (loading()) {
    <div class="d-flex justify-content-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  }

  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  }

  @if (product(); as p) {
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/products">Products</a></li>
        <li class="breadcrumb-item active">{{ p.title }}</li>
      </ol>
    </nav>

    <div class="card shadow-sm">
      <div class="row g-0">
        <div class="col-md-5">
          <img
            [src]="p.imageP || 'https://placehold.co/600x400?text=No+Image'"
            [alt]="p.title"
            class="img-fluid rounded-start"
            style="object-fit: cover; height: 100%; max-height: 420px; width: 100%;"
          />
        </div>
        <div class="col-md-7">
          <div class="card-body p-4">
            <h2 class="card-title">{{ p.title }}</h2>

            <p class="fs-4 fw-bold text-primary my-3">${{ p.price | number:'1.2-2' }}</p>

            <p class="card-text text-muted">{{ p.descriptionP }}</p>

            <hr />

            <p class="mb-1">
              <strong>Availability: </strong>
              <span [class]="stockClass">{{ stockLabel }}</span>
            </p>

            <div class="mt-4 d-flex gap-2">
              <button class="btn btn-success btn-lg" (click)="addToCart(product())" [disabled]="product()?.stock === 0"> Add to Cart</button>
              <a routerLink="/products" class="btn btn-outline-secondary">
                Back to Products
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  }

</div>
