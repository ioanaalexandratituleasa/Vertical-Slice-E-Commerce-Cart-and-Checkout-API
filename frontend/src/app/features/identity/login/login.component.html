<div class="container py-5" style="max-width: 480px;">
      <div class="card shadow-sm p-4">
        <h3 class="mb-4">Login</h3>

        @if (error()) {
          <div class="alert alert-danger">{{ error() }}</div>
        }

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="password" />
        </div>

        <button class="btn btn-primary w-100"
          (click)="onSubmit()" [disabled]="loading()">
          {{ loading() ? 'Se autentifică...' : 'Login' }}
        </button>

        <p class="text-center mt-3 text-muted" style="font-size: 13px;">
          Don't have an account?
          <a routerLink="/register">Register</a>
        </p>
      </div>
    </div>
