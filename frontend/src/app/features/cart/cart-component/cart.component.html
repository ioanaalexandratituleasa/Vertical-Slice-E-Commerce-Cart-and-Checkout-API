<div class="container mt-4">
  <h2>Your Shopping Cart</h2>

  @if (cart().length === 0) {
    <div class="alert alert-info">Your cart is empty. <a routerLink="/products">Go shopping!</a></div>
  } @else {
    <table class="table align-middle">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Subtotal</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        @for (item of cart(); track item.productID) {
          <tr>
            <td>{{ item.title }}</td>
            <td>${{ item.price }}</td>
            <td>{{ item.quantity }}</td>
            <td>${{ item.price * item.quantity }}</td>
            <td>
              <button class="btn btn-sm btn-danger" (click)="removeItem(item.productID)">Remove</button>
            </td>
          </tr>
        }
      </tbody>
    </table>

    <div class="d-flex justify-content-end mt-4">
      <div class="card p-3 shadow-sm">
        <h4>Total: ${{ totalPrice() }}</h4>
        <button class="btn btn-success btn-lg mt-2" routerLink="/checkout">Proceed to Checkout</button>
      </div>
    </div>
  }
</div>
